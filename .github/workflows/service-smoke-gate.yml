name: service-smoke-gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Run service smoke tests
        run: uv run pytest tests/test_service.py tests/test_mcp.py::TestWorkflowTools tests/test_mcp.py::TestBrowseTools -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web
        run: npm run build
        working-directory: web
